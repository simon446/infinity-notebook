[package]
name = "infinity-notebook"
version = "0.2.0"
authors = ["Simon Johansson <simjo273@student.liu.se>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.100"
num-bigint = "0.4"
num-traits = "0.2"
libm = "0.2"
substring = "1.4.5"

# Logs panics with `console.error`, which helps debugging at some cost in
# code size.
console_error_panic_hook = { version = "0.1.7", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Tests run the language model, which is far too slow unoptimized.
[profile.dev]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]
