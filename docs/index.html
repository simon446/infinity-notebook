<!doctype html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Blank until the page has been read; then its first heading, or "Notes". -->
    <title>&lrm;</title>
    <meta name="author" content="Simon Johansson">
    <meta name="description" content="Every text that fits on one page already has a page in this notebook. Write something and open the page it is on.">

    <!-- What a link to the notebook looks like when shared. It is the same
         for every page: the page number is not sent along with the link. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Infinity Notebook">
    <meta property="og:title" content="Infinity Notebook">
    <meta property="og:description" content="Every text that fits on one page already has a page in this notebook. Write something and open the page it is on.">
    <meta property="og:url" content="https://simon446.me/">
    <meta property="og:image" content="https://simon446.me/card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A ruled page with the words Infinity Notebook written on it.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#fdfcf9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#13171d" media="(prefers-color-scheme: dark)">

    <link rel="icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handlee&display=swap">

    <style>
        :root {
            --line: 30px;           /* height of one ruled line */
            --text: 19px;           /* size of the handwriting */
            --measure: 46rem;       /* width of the column of writing */
            --paper: #fdfcf9;
            --surface: #ffffff;     /* things that float over the paper */
            --ink: #1d2530;
            --faded-ink: #8a929e;
            --rule: #e4e8ee;
            --accent: #c8452f;
            --shadow: rgba(20, 30, 45, .14);
            --ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #13171d;
                --surface: #1c222b;
                --ink: #d5dbe3;
                --faded-ink: #6f7a88;
                --rule: #232a33;
                --accent: #ff8f7d;
                --shadow: rgba(0, 0, 0, .5);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--ui);
            -webkit-text-size-adjust: 100%;
        }

        /* The page fills the window: ruled from edge to edge, with the
           writing in a column down the middle. */
        .notebook {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* The pencil: all there is besides the page, until it is pressed.
           Beside it, how many drafts there are, if any. */
        .corner {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .editing .corner { display: none; }
        .edit { position: relative; opacity: .45; }
        .edit:focus-visible { opacity: 1; }
        /* A dot on the pencil: what is on the page is a draft, not the page. */
        .unsaved .edit { opacity: .8; }
        .unsaved .edit::after {
            content: '';
            position: absolute;
            top: 7px; right: 7px;
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }
        .kept { opacity: .45; }
        .kept:focus-visible { opacity: 1; }

        .icon {
            flex: none;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--faded-ink);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .icon:focus-visible { outline: 2px solid var(--faded-ink); outline-offset: -2px; }
        .icon:active:not(:disabled) { transform: scale(.94); }
        .icon:disabled { opacity: .3; cursor: default; }
        .icon[hidden] { display: none; }
        .icon.rolling svg { animation: roll .45s ease-out; }
        /* An icon with a number on it */
        .counted { position: relative; }
        .counted span[hidden] { display: none; }
        .counted span {
            position: absolute;
            top: 3px; right: 1px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 8px;
            background: var(--ink);
            color: var(--paper);
            font: 700 10px/16px var(--ui);
        }
        @keyframes roll { from { transform: rotate(-180deg) scale(.7); } }
        /* Only where there is a pointer to hover with: a touch screen would
           leave the last button tapped looking lit. */
        @media (hover: hover) {
            .edit:hover { opacity: 1; }
            .icon:hover:not(:disabled), .tools button:hover, .draft-open:hover:not(:disabled) { background: var(--rule); color: var(--ink); }
            .kept:hover { opacity: 1; }
            .find:hover, .note-action:hover { filter: brightness(1.15); }
            .draft-discard:hover:not(:disabled) { color: var(--accent); }
        }

        /* What the pencil brings out: the page number, page flipping and
           formatting, in a bar that stays at the top. */
        .bar {
            display: none;
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 2;
            padding: env(safe-area-inset-top) max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
            background: color-mix(in srgb, var(--paper) 86%, transparent);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--rule);
        }
        .editing .bar { display: block; }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 2px;
            max-width: var(--measure);
            margin: 0 auto;
        }
        .page-row { height: 52px; }
        .pagenum {
            flex: 1;
            min-width: 0;
            height: 36px;
            padding: 0 8px;
            border: 0;
            border-radius: 10px;
            outline: 0;
            background: transparent;
            color: var(--ink);
            font: 600 15px/1 var(--ui);
            text-align: center;
            text-overflow: ellipsis;
        }
        .pagenum:focus { background: var(--rule); }
        .find {
            flex: none;
            height: 34px;
            margin: 0 4px 0 6px;
            padding: 0 14px;
            border: 0;
            border-radius: 999px;
            background: var(--ink);
            color: var(--paper);
            font: 600 14px/1 var(--ui);
            white-space: nowrap;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .find[hidden] { display: none; }
        .find:focus-visible { outline: 2px solid var(--faded-ink); outline-offset: 2px; }

        /* A narrow screen: closer together, so the page number keeps some room. */
        @media (max-width: 480px) {
            .page-row .icon { width: 34px; }
            .find { margin: 0 2px; padding: 0 12px; font-size: 13px; }
            .pagenum { padding: 0 2px; font-size: 14px; }
        }

        .tools {
            height: 40px;
            padding-bottom: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tools::-webkit-scrollbar { display: none; }
        .tools button {
            flex: none;
            min-width: 36px;
            height: 30px;
            padding: 0 9px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--faded-ink);
            font: 600 13px/1 var(--ui);
            white-space: nowrap;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .tools button:focus-visible { outline: 2px solid var(--faded-ink); outline-offset: -2px; }
        .tools button[aria-pressed="true"] { background: var(--rule); color: var(--ink); }
        .tools .italic { font-style: italic; }
        @media (pointer: coarse) {
            .tools { height: 48px; gap: 4px; }
            .tools button { min-width: 42px; height: 38px; font-size: 14px; }
        }

        /* The ruled sheet. Every block on it is a whole number of lines tall,
           so the writing stays on the rules. */
        .sheet {
            flex: 1;
            padding-top: calc(2 * var(--line));
            background: linear-gradient(to bottom, transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px)) 0 0 / 100% var(--line);
        }
        .editing .sheet { padding-top: var(--line); }
        .content {
            position: relative;
            max-width: var(--measure);
            min-height: 60vh;
            margin: 0 auto;
            /* index.js measures where each kind of writing puts its ink and
               sets these shifts, so that all of it stands exactly on the rules. */
            padding: var(--shift-text, 9px) max(20px, env(safe-area-inset-right)) calc(4 * var(--line)) max(20px, env(safe-area-inset-left));
            outline: 0;
            color: var(--ink);
            font: 400 var(--text)/var(--line) 'Handlee', 'Comic Sans MS', cursive;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            -webkit-font-variant-ligatures: none;
            font-variant-ligatures: none;
        }
        .content p, .content h1, .content h2, .content h3, .content h4, .content h5, .content h6,
        .content ul, .content ol, .content blockquote, .content pre, .content hr { margin: 0; }
        /* One empty line between blocks, as in the Markdown. */
        .content > :not(:first-child) { margin-top: var(--line); }
        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6, .content pre,
        .content strong, .content code {
            --lines: 1;             /* rules per line of this block's writing */
            position: relative;
        }
        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6, .content pre {
            line-height: calc(var(--lines) * var(--line));
        }
        .content h1 { top: var(--shift-h1, 11px); }
        .content h2 { top: var(--shift-h2, -2px); }
        .content h3 { top: var(--shift-h3, -1px); }
        .content h4, .content h5, .content h6 { top: var(--shift-h4, 0px); }
        .content pre { top: var(--shift-pre, 0px); }
        .content strong { top: var(--shift-strong, 0px); }
        .content code { top: var(--shift-code, 0px); }
        .content pre code, .content h1 strong, .content h2 strong, .content h3 strong,
        .content h4 strong, .content h5 strong, .content h6 strong { top: 0; }
        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 { font-weight: bold; }
        .content h1 { font-size: 34px; --lines: 2; }
        .content h2 { font-size: 27px; }
        .content h3 { font-size: 22px; }
        .content h4, .content h5, .content h6 { font-size: var(--text); }
        .content strong { font-weight: bold; }
        .content em { font-style: italic; }
        /* No underline: the rule already runs under the words. */
        .content a { color: var(--accent); text-decoration: none; cursor: pointer; }
        .content ol { padding-left: 1.3em; }
        /* A bullet is a dash written in front of the item, in the same hand. */
        .content ul { list-style: none; padding-left: 0; }
        .content ul > li { padding-left: .85em; }
        .content ul > li > p:first-child::before {
            content: '\2013';
            display: inline-block;
            width: .85em;
            margin-left: -.85em;
        }
        .content li > * + * { margin-top: 0; }
        .content ul:not([data-tight="true"]) > li + li, .content ol:not([data-tight="true"]) > li + li { margin-top: var(--line); }
        .content blockquote {
            padding-left: 14px;
            border-left: 2px solid var(--faded-ink);
            color: var(--faded-ink);
        }
        .content blockquote > * + * { margin-top: var(--line); }
        .content code {
            font: 15px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            padding: 2px 0;
            background: color-mix(in srgb, var(--rule) 45%, transparent);
            border-radius: 4px;
        }
        .content pre {
            font-size: 15px;
            padding: 0 10px;
            border-radius: 6px;
            background: color-mix(in srgb, var(--rule) 45%, transparent);
            white-space: pre-wrap;
        }
        .content pre code { background: none; padding: 0; line-height: inherit; }
        .content hr {
            height: var(--line);
            border: 0;
            background: linear-gradient(var(--faded-ink), var(--faded-ink)) center / 40% 2px no-repeat;
        }
        .content .ProseMirror-gapcursor { display: none; pointer-events: none; position: absolute; }
        .content .ProseMirror-gapcursor::after {
            content: '';
            display: block;
            position: absolute;
            top: -2px;
            width: 20px;
            border-top: 1px solid var(--ink);
        }
        .content.ProseMirror-focused .ProseMirror-gapcursor { display: block; }
        .content .ProseMirror-selectednode { outline: 2px solid var(--accent); }

        /* What is going on, said in a card at the bottom of the window */
        .note {
            position: fixed;
            left: 50%;
            bottom: max(18px, env(safe-area-inset-bottom));
            z-index: 4;
            width: min(400px, calc(100% - 28px));
            padding: 14px 16px;
            transform: translateX(-50%);
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--rule);
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow);
            font: 15px/1.4 var(--ui);
            animation: rise .2s ease-out;
        }
        .note[hidden] { display: none; }
        @keyframes rise { from { transform: translate(-50%, 10px); opacity: 0; } }
        .note-text { margin: 0; }
        .note-action {
            display: block;
            width: 100%;
            min-height: 40px;
            margin-top: 12px;
            padding: 8px 16px;
            border: 0;
            border-radius: 10px;
            background: var(--ink);
            color: var(--paper);
            font: 600 14px/1.2 var(--ui);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .note-action:focus-visible { outline: 2px solid var(--faded-ink); outline-offset: 2px; }
        .note-action:active { transform: scale(.98); }
        .note-action[hidden] { display: none; }

        /* The list of drafts */
        .drafts {
            width: min(440px, calc(100% - 24px));
            max-height: min(72vh, 560px);
            padding: 6px 8px 10px;
            border: 1px solid var(--rule);
            border-radius: 18px;
            background: var(--surface);
            color: var(--ink);
            box-shadow: 0 20px 60px var(--shadow);
            font: 15px/1.4 var(--ui);
        }
        .drafts::backdrop { background: rgba(10, 15, 22, .28); }
        .drafts header { display: flex; align-items: center; justify-content: space-between; padding-left: 10px; }
        .drafts h2 { margin: 0; font: 600 16px/1 var(--ui); }
        .drafts section[hidden] { display: none; }
        .drafts section + section { margin-top: 10px; }
        .drafts h3 { margin: 8px 10px 2px; color: var(--faded-ink); font: 600 12px/1.4 var(--ui); letter-spacing: .04em; text-transform: uppercase; }
        .drafts p { margin: 0 10px 6px; color: var(--faded-ink); font-size: 13px; }
        .drafts ul { margin: 0; padding: 0; list-style: none; }
        .drafts li { display: flex; align-items: center; gap: 4px; }
        .draft-open {
            flex: 1;
            min-width: 0;
            padding: 9px 10px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--ink);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }
        .draft-open strong, .draft-open span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .draft-open strong { font-weight: 600; }
        .draft-open span { color: var(--faded-ink); font-size: 13px; }
        .draft-open:disabled { opacity: .5; cursor: default; }
        .draft-discard {
            flex: none;
            padding: 8px 10px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--faded-ink);
            font: 600 13px/1 var(--ui);
            cursor: pointer;
        }
        .draft-discard.sure { color: var(--accent); }
        .draft-discard:disabled { opacity: .4; cursor: default; }

        /* How far along the work is */
        .progress {
            position: relative;
            height: 3px;
            margin-top: 12px;
            border-radius: 3px;
            background: var(--rule);
            overflow: hidden;
        }
        .progress[hidden] { display: none; }
        .progress-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: var(--progress, 0%);
            border-radius: 3px;
            background: var(--ink);
            transition: width .25s ease-out;
        }
        /* Unknown amount of work: a piece of the line slides along. */
        .progress.scribble .progress-fill { width: 35%; transition: none; animation: slide 1.2s ease-in-out infinite alternate; }
        @keyframes slide { from { left: 0; } to { left: 65%; } }

        /* On paper: a sheet of ruled paper with the writing on it and nothing
           else. The rules are 30px apart, which is 8 mm: ordinary ruled
           paper. Smaller sheets get a narrower ruling, as smaller notebooks do. */
        @page { margin: 12mm; }
        @media print {
            :root {
                --paper: #fff;
                --ink: #000;
                --faded-ink: #444;
                --rule: #b9c3d2;
                --accent: #000;
                --measure: none;
                color-scheme: light;
            }
            body { background: none; }
            .bar, .corner, .note, .drafts { display: none !important; }
            /* a full sheet of rules, however little is written on it */
            .notebook { min-height: calc(100vh - var(--line)); }
            .sheet, .editing .sheet {
                padding-top: 0;
                /* the rules are a background; print them all the same */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                /* Every sheet starts its rules afresh, as it starts its
                   writing at the top. So the writing is not pushed down onto
                   the rules, as on screen; the rules are pulled up under it. */
                -webkit-box-decoration-break: clone;
                box-decoration-break: clone;
                background-position: 0 calc(-1 * var(--shift-text, 9px));
            }
            .content { min-height: 0; padding: 0 2px; }
            .content code, .content pre { background: none; }
            .content a { color: inherit; }
        }
        @media print and (max-width: 160mm) { .notebook { zoom: .88; } }  /* A5: 7 mm */
        @media print and (max-width: 115mm) { .notebook { zoom: .76; } }  /* A6: 6 mm */

        @media (prefers-reduced-motion: reduce) {
            .note, .icon.rolling svg, .progress.scribble .progress-fill { animation: none; }
            .progress-fill { transition: none; }
        }
    </style>
</head>

<body>
    <main class="notebook">
        <div class="corner">
            <button id="drafts-chip" class="icon counted kept" type="button" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.5 6.5 5h11L20 13.5V18a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/></svg>
                <span></span>
            </button>
            <button id="edit" class="icon edit" type="button" aria-label="Edit this page" title="Edit this page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3"/><path d="m14.5 7.5 3 3"/></svg>
            </button>
        </div>
        <header class="bar">
            <div class="bar-row page-row">
                <button id="previous" class="icon" type="button" aria-label="Previous page" title="Previous page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>
                </button>
                <input id="pagenum" class="pagenum" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Page number" title="Type a page number">
                <button id="next" class="icon" type="button" aria-label="Next page" title="Next page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg>
                </button>
                <button id="random" class="icon" type="button" aria-label="Random page" title="Random page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 8.5h.01M15.5 8.5h.01M12 12h.01M8.5 15.5h.01M15.5 15.5h.01" stroke-width="2.6"/></svg>
                </button>
                <button id="link" class="icon" type="button" aria-label="Copy a short link to this page" title="Copy a short link to this page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13.5a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10.5a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>
                </button>
                <button id="drafts-button" class="icon counted" type="button" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.5 6.5 5h11L20 13.5V18a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/></svg>
                    <span></span>
                </button>
                <button id="find" class="find" type="button" hidden>Find page</button>
                <button id="view" class="icon" type="button" aria-label="Back to reading" title="Back to reading">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
                </button>
            </div>
            <div id="tools" class="bar-row tools" role="toolbar" aria-label="Formatting">
                <button type="button" data-format="strong" aria-label="Bold" title="Bold" aria-pressed="false">B</button>
                <button type="button" data-format="em" class="italic" aria-label="Italic" title="Italic" aria-pressed="false">I</button>
                <button type="button" data-format="heading1" aria-label="Large heading" title="Large heading" aria-pressed="false">H1</button>
                <button type="button" data-format="heading2" aria-label="Small heading" title="Small heading" aria-pressed="false">H2</button>
                <button type="button" data-format="bullet_list" aria-label="Bullet list" title="Bullet list" aria-pressed="false">List</button>
                <button type="button" data-format="ordered_list" aria-label="Numbered list" title="Numbered list" aria-pressed="false">1. List</button>
                <button type="button" data-format="blockquote" aria-label="Quote" title="Quote" aria-pressed="false">Quote</button>
            </div>
        </header>
        <div id="sheet" class="sheet">
            <div id="content" class="content" role="textbox" aria-multiline="true" aria-label="Page text" spellcheck="false"></div>
        </div>
        <aside id="note" class="note" role="status" aria-live="polite" hidden>
            <p id="note-text" class="note-text"></p>
