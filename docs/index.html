<!doctype html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Infinity Notebook</title>
    <meta name="author" content="Simon Johansson">
    <meta name="description" content="A notebook that contains every piece of text that will ever exist.">
    <meta name="theme-color" content="#ece9e2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">

    <link rel="icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handlee&family=Roboto+Slab:wght@400;600&display=swap">

    <style>
        :root {
            --line: 30px;           /* height of one ruled line */
            --text: 19px;           /* size of the handwriting */
            --margin: 64px;         /* the punched margin on the left */
            --hole: 6px;
            --gap: 32px;            /* space around the notebook */
            --desk: #ece9e2;
            --paper: #fffdf8;
            --ink: #1f2933;
            --faded-ink: #6b7480;
            --rule: #cfd8e6;
            --margin-rule: #f0a8a8;
            --accent: #d1483b;
            --note: #fff2a1;
            --note-ink: #4a3f12;
            --shadow: rgba(0, 0, 0, .22);
            color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --desk: #0e1117;
                --paper: #161b22;
                --ink: #c8d1d9;
                --faded-ink: #7d8794;
                --rule: #2b323b;
                --margin-rule: #5c3033;
                --accent: #ff8a7a;
                --note: #f4e58c;
                --note-ink: #3b3210;
                --shadow: rgba(0, 0, 0, .6);
            }
        }
        @media (max-width: 600px) {
            :root {
                --margin: 30px;
                --hole: 4px;
                --gap: 10px;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: var(--gap) max(var(--gap), env(safe-area-inset-right)) 0 max(var(--gap), env(safe-area-inset-left));
            background: var(--desk);
            color: var(--ink);
            font-family: 'Handlee', 'Comic Sans MS', cursive;
            -webkit-text-size-adjust: 100%;
        }

        /* The page */
        .notebook {
            position: relative;
            display: flex;
            flex-direction: column;
            max-width: 820px;
            min-height: calc(100vh - var(--gap) - 64px);
            min-height: calc(100dvh - var(--gap) - 64px);
            margin: 0 auto;
            background: var(--paper);
            border-radius: 10px;
            box-shadow: 0 2px 10px var(--shadow);
        }
        .notebook::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: var(--margin);
            background: radial-gradient(circle, var(--desk) var(--hole), transparent calc(var(--hole) + 1px)) center top / 100% var(--line) repeat-y;
            border-right: 2px solid var(--margin-rule);
            border-radius: 10px 0 0 10px;
            pointer-events: none;
        }

        /* Page number and page flipping */
        .page-header {
            display: flex;
            align-items: center;
            gap: 2px;
            height: calc(2 * var(--line));
            padding: 0 6px 0 calc(var(--margin) + 4px);
            border-bottom: 1px solid var(--rule);
        }
        .pagenum {
            flex: 1;
            min-width: 0;
            height: 44px;
            padding: 0 6px;
            border: 0;
            border-radius: 8px;
            outline: 0;
            background: transparent;
            color: var(--ink);
            font: 600 16px/1 'Roboto Slab', Georgia, serif;
            text-align: center;
            text-overflow: ellipsis;
        }
        .pagenum:focus { background: color-mix(in srgb, var(--rule) 45%, transparent); }
        .flip {
            flex: none;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faded-ink);
            font: 600 28px/1 'Roboto Slab', Georgia, serif;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .flip:focus-visible { background: color-mix(in srgb, var(--rule) 55%, transparent); color: var(--ink); outline: 0; }
        /* Only where there is a pointer to hover with: a touch screen would
           leave the last button tapped looking lit. */
        @media (hover: hover) {
            .flip:hover:not(:disabled), .tools button:hover { background: color-mix(in srgb, var(--rule) 55%, transparent); color: var(--ink); }
            .note-action:hover { filter: brightness(1.35); }
        }
        .flip:active:not(:disabled) { transform: scale(.92); }
        .flip:disabled { opacity: .3; cursor: default; }
        .flip.dice { font-size: 22px; }
        .flip svg { display: block; margin: auto; }
        .flip.dice.rolling { animation: roll .45s ease-out; }
        @keyframes roll { from { transform: rotate(-200deg) scale(.7); } to { transform: none; } }

        /* Formatting buttons, on a line of their own under the page number */
        .tools {
            display: flex;
            align-items: center;
            gap: 2px;
            height: var(--line);
            padding: 0 6px 0 calc(var(--margin) + 6px);
            border-bottom: 1px solid var(--rule);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tools::-webkit-scrollbar { display: none; }
        .tools button {
            flex: none;
            min-width: 34px;
            height: 26px;
            padding: 0 7px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--faded-ink);
            font: 600 14px/1 'Roboto Slab', Georgia, serif;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .tools button:focus-visible { outline: 2px solid var(--faded-ink); outline-offset: -2px; }
        .tools button[aria-pressed="true"] { background: color-mix(in srgb, var(--rule) 80%, transparent); color: var(--ink); }
        .tools .italic { font-style: italic; }
        @media (pointer: coarse) {
            .tools { height: calc(1.5 * var(--line)); gap: 6px; }
            .tools button { min-width: 40px; height: 36px; }
        }

        /* The ruled sheet. Every block on it is a whole number of lines tall,
           so the writing stays on the rules. */
        .sheet {
            flex: 1;
            display: flex;
            padding-left: var(--margin);
            background: linear-gradient(to bottom, transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px)) 0 0 / 100% var(--line);
            border-radius: 0 0 10px 10px;
        }
        .content {
            position: relative;
            flex: 1;
            min-width: 0;
            min-height: calc(8 * var(--line));
            /* index.js measures where each kind of writing puts its ink and
               sets these shifts, so that all of it stands exactly on the rules. */
            padding: var(--shift-text, 9px) 14px var(--line) 12px;
            outline: 0;
            color: var(--ink);
            font: 400 var(--text)/var(--line) 'Handlee', 'Comic Sans MS', cursive;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            -webkit-font-variant-ligatures: none;
            font-variant-ligatures: none;
        }
        .content[contenteditable="false"] { cursor: default; }
        .content p, .content h1, .content h2, .content h3, .content h4, .content h5, .content h6,
        .content ul, .content ol, .content blockquote, .content pre, .content hr { margin: 0; }
        /* One empty line between blocks, as in the Markdown. */
        .content > :not(:first-child) { margin-top: var(--line); }
        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6, .content pre,
        .content strong, .content code {
            --lines: 1;             /* rules per line of this block's writing */
            position: relative;
        }
        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6, .content pre {
            line-height: calc(var(--lines) * var(--line));
        }
        .content h1 { top: var(--shift-h1, 11px); }
        .content h2 { top: var(--shift-h2, -2px); }
        .content h3 { top: var(--shift-h3, -1px); }
        .content h4, .content h5, .content h6 { top: var(--shift-h4, 0px); }
        .content pre { top: var(--shift-pre, 0px); }
        .content strong { top: var(--shift-strong, 0px); }
        .content code { top: var(--shift-code, 0px); }
        .content pre code, .content h1 strong, .content h2 strong, .content h3 strong,
        .content h4 strong, .content h5 strong, .content h6 strong { top: 0; }
        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 { font-weight: bold; }
        .content h1 { font-size: 34px; --lines: 2; }
        .content h2 { font-size: 27px; }
        .content h3 { font-size: 22px; }
        .content h4, .content h5, .content h6 { font-size: var(--text); }
        .content strong { font-weight: bold; }
        .content em { font-style: italic; }
        /* No underline: the rule already runs under the words. */
        .content a { color: var(--accent); text-decoration: none; cursor: pointer; }
        .content ol { padding-left: 1.3em; }
        /* A bullet is a dash written in front of the item, in the same hand. */
        .content ul { list-style: none; padding-left: 0; }
        .content ul > li { padding-left: .85em; }
        .content ul > li > p:first-child::before {
            content: '\2013';
            display: inline-block;
            width: .85em;
            margin-left: -.85em;
        }
        .content li > * + * { margin-top: 0; }
        .content ul:not([data-tight="true"]) > li + li, .content ol:not([data-tight="true"]) > li + li { margin-top: var(--line); }
        .content blockquote {
            padding-left: 14px;
            border-left: 3px solid var(--margin-rule);
            color: var(--faded-ink);
        }
        .content blockquote > * + * { margin-top: var(--line); }
        .content code {
            font: 15px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            padding: 2px 0;
            background: color-mix(in srgb, var(--rule) 45%, transparent);
            border-radius: 4px;
        }
        .content pre {
            font-size: 15px;
            padding: 0 10px;
            border-radius: 6px;
            background: color-mix(in srgb, var(--rule) 45%, transparent);
            white-space: pre-wrap;
        }
        .content pre code { background: none; padding: 0; line-height: inherit; }
        .content hr {
            height: var(--line);
            border: 0;
            background: linear-gradient(var(--faded-ink), var(--faded-ink)) center / 40% 2px no-repeat;
        }
        .content .ProseMirror-gapcursor { display: none; pointer-events: none; position: absolute; }
        .content .ProseMirror-gapcursor::after {
            content: '';
            display: block;
            position: absolute;
            top: -2px;
            width: 20px;
            border-top: 1px solid var(--ink);
        }
        .content.ProseMirror-focused .ProseMirror-gapcursor { display: block; }
        .content .ProseMirror-selectednode { outline: 2px solid var(--accent); }

        /* The sticky note that says what is going on */
        .note {
            position: -webkit-sticky;
            position: sticky;
            bottom: max(14px, env(safe-area-inset-bottom));
            z-index: 2;
            align-self: center;
            width: min(400px, calc(100% - var(--margin) - 20px));
            margin: 0 0 14px var(--margin);
            padding: 14px 16px 16px;
            background: var(--note);
            color: var(--note-ink);
            border-radius: 2px 2px 18px 2px;
            box-shadow: 0 8px 18px var(--shadow), inset 0 12px 10px -10px rgba(0, 0, 0, .12);
            transform: rotate(-1.2deg);
            font-size: 17px;
            line-height: 1.35;
            animation: stick .25s ease-out;
        }
        .note[hidden] { display: none; }
        @keyframes stick { from { transform: rotate(-4deg) translateY(16px) scale(.96); opacity: 0; } }
        .note-text { margin: 0; }
        .note-action {
            display: block;
            width: 100%;
            min-height: 44px;
            margin-top: 12px;
            padding: 8px 16px;
            border: 0;
            border-radius: 999px;
            background: var(--note-ink);
            color: var(--note);
            font: bold 17px/1.2 'Handlee', 'Comic Sans MS', cursive;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .note-action:focus-visible { filter: brightness(1.35); outline: 0; }
        .note-action:active { transform: scale(.98); }
        .note-action[hidden] { display: none; }

        /* A pencil drawing a line: the progress bar */
        .pencil-track {
            position: relative;
            height: 26px;
            margin-top: 6px;
            border-bottom: 2px dashed color-mix(in srgb, var(--note-ink) 25%, transparent);
        }
        .pencil-track[hidden] { display: none; }
        .pencil-line {
            position: absolute;
            left: 0; bottom: -2px;
            width: var(--progress, 0%);
            height: 3px;
            border-radius: 3px;
            background: var(--note-ink);
            transition: width .25s ease-out;
        }
        .pencil {
            position: absolute;
            left: var(--progress, 0%);
            bottom: -1px;
            margin-left: -10px;     /* the pencil sits on the end of its line */
            font-size: 20px;
            line-height: 1;
            transition: left .25s ease-out;
            animation: write .5s ease-in-out infinite alternate;
            transform-origin: 0 100%;
        }
        @keyframes write { from { transform: rotate(-5deg); } to { transform: rotate(7deg) translateY(-1px); } }
        /* Unknown amount of work: scribble back and forth. */
        .pencil-track.scribble .pencil-line { width: 100%; opacity: .25; transition: none; }
        .pencil-track.scribble .pencil { transition: none; animation: scribble 1.6s ease-in-out infinite alternate, write .3s ease-in-out infinite alternate; }
        @keyframes scribble { from { left: 10px; } to { left: calc(100% - 10px); } }

        footer {
            max-width: 820px;
            margin: 0 auto;
            padding: 14px 8px calc(14px + env(safe-area-inset-bottom));
            color: var(--faded-ink);
            font-size: 14px;
            text-align: center;
        }
        footer a { color: inherit; }

        @media (prefers-reduced-motion: reduce) {
            .note, .pencil, .flip.dice.rolling, .pencil-track.scribble .pencil { animation: none; }
            .pencil-line, .pencil { transition: none; }
        }
    </style>
</head>

<body>
    <main class="notebook">
        <header class="page-header">
            <button id="previous" class="flip" type="button" aria-label="Previous page" title="Previous page">&lsaquo;</button>
            <input id="pagenum" class="pagenum" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Page number" title="Type a page number">
            <button id="next" class="flip" type="button" aria-label="Next page" title="Next page">&rsaquo;</button>
            <button id="random" class="flip dice" type="button" aria-label="Random page" title="Random page">&#127922;</button>
            <button id="link" class="flip" type="button" aria-label="Copy a short link to this page" title="Copy a short link to this page">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 13.5a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/>
                    <path d="M14 10.5a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/>
                </svg>
            </button>
        </header>
        <div id="tools" class="tools" role="toolbar" aria-label="Formatting">
            <button type="button" data-format="strong" aria-label="Bold" title="Bold" aria-pressed="false">B</button>
            <button type="button" data-format="em" class="italic" aria-label="Italic" title="Italic" aria-pressed="false">I</button>
            <button type="button" data-format="heading1" aria-label="Large heading" title="Large heading" aria-pressed="false">H1</button>
            <button type="button" data-format="heading2" aria-label="Small heading" title="Small heading" aria-pressed="false">H2</button>
            <button type="button" data-format="bullet_list" aria-label="Bullet list" title="Bullet list" aria-pressed="false">&bull; List</button>
            <button type="button" data-format="ordered_list" aria-label="Numbered list" title="Numbered list" aria-pressed="false">1. List</button>
            <button type="button" data-format="blockquote" aria-label="Quote" title="Quote" aria-pressed="false">&ldquo; Quote</button>
        </div>
        <div id="sheet" class="sheet">
            <div id="content" class="content" role="textbox" aria-multiline="true" aria-label="Page text" spellcheck="false"></div>
        </div>
        <aside id="note" class="note" role="status" aria-live="polite" hidden>
            <p id="note-text" class="note-text"></p>
            <div id="note-progress" class="pencil-track" hidden>
                <div class="pencil-line"></div>
                <span class="pencil" aria-hidden="true">&#9999;&#65039;</span>
            </div>
            <button id="note-action" class="note-action" type="button" hidden></button>
        </aside>
    </main>
    <footer>
        Every page is already written. You are only finding it.
        &middot; <a href="https://github.com/simon446/infinity-notebook">Source on GitHub</a>
    </footer>
    <script type="module" src="./index-K2OE2XPA.js"></script>
</body>
</html>
