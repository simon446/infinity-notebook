<!doctype html>
<!-- The picture shown with links to the notebook (www/preview.png): open this
     page in a browser at 1200 x 630 and take a screenshot. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handlee&family=Roboto+Slab:wght@600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #ece9e2; position: relative; overflow: hidden; font-family: 'Handlee', cursive; color: #1f2933; }
  .paper { position: absolute; left: 70px; right: 70px; top: 56px; bottom: -40px; background: #fffdf8; border-radius: 22px 22px 0 0; box-shadow: 0 6px 30px rgba(0,0,0,.22);
           overflow: hidden; }
  .rules { position: absolute; left: 0; right: 0; top: 153px; bottom: 0;
           background-image: linear-gradient(to bottom, transparent 69px, #cfd8e6 69px); background-size: 100% 72px; background-position: 0 -94px; background-repeat: repeat-y; }
  .paper::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 130px; border-right: 4px solid #f0a8a8;
           background: radial-gradient(circle, #ece9e2 15px, transparent 16px) center top / 100% 72px repeat-y; background-position: center 6px; }
  .header { position: absolute; left: 134px; right: 0; top: 0; height: 150px; border-bottom: 3px solid #cfd8e6; background: #fffdf8; border-radius: 0 22px 0 0; display: flex; align-items: center; justify-content: center;
           font: 600 40px 'Roboto Slab', serif; color: #6b7480; letter-spacing: .5px; }
  h1 { position: absolute; left: 170px; top: 171px; margin: 0; font-size: 104px; line-height: 144px; height: 144px; font-weight: bold; }
  p { position: absolute; left: 170px; right: 60px; margin: 0; font-size: 46px; line-height: 72px; }
</style></head><body>
<div class="paper">
  <div class="rules"></div>
  <div class="header">Page &infin;</div>
  <h1 id="title">Infinity Notebook</h1>
  <p id="line" style="top: 294px">Every text that fits on one page already has a page in here. Write something and open the page it is on.</p>
</div>
</body></html>
