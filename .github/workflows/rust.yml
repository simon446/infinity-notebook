name: Build

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: www/package-lock.json
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Test
      run: cargo test
    - name: Build
      run: |
        rustup target add wasm32-unknown-unknown
        cd www
        npm ci
        npm run build
        rm -rf ../docs
        mv dist ../docs
        # GitHub Pages reads the custom domain from this file. The build
        # replaces docs/, so write it back every time.
        echo simon446.me > ../docs/CNAME
    # GitHub Pages serves docs/ from master.
    - uses: stefanzweifel/git-auto-commit-action@v5
      if: github.event_name == 'push'
      with:
        commit_message: Update static www files
        file_pattern: docs
